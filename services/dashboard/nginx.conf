server {
    listen 8090;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the dashboard
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend services
    # This lets the frontend call /api/v1/transactions and it routes to transaction-api
    location /api/v1/transactions {
        proxy_pass http://transaction-api.finflow.svc.cluster.local;
        proxy_http_version 1.1;
        proxy_set_header Host transaction-api.finflow.svc.cluster.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    location /api/v1/accounts {
        proxy_pass http://account-service.finflow.svc.cluster.local;
        proxy_http_version 1.1;
        proxy_set_header Host account-service.finflow.svc.cluster.local;
        proxy_set_header Connection "";
    }

    location /api/v1/transfers {
        proxy_pass http://account-service.finflow.svc.cluster.local;
        proxy_http_version 1.1;
        proxy_set_header Host account-service.finflow.svc.cluster.local;
        proxy_set_header Connection "";
    }

    location /api/v1/score {
        proxy_pass http://fraud-detection.finflow.svc.cluster.local;
        proxy_http_version 1.1;
        proxy_set_header Host fraud-detection.finflow.svc.cluster.local;
        proxy_set_header Connection "";
    }

    location /api/v1/process {
        proxy_pass http://payment-processor.finflow.svc.cluster.local;
        proxy_http_version 1.1;
        proxy_set_header Host payment-processor.finflow.svc.cluster.local;
        proxy_set_header Connection "";
    }

    location /api/v1/notify {
        proxy_pass http://notification-service.finflow.svc.cluster.local;
        proxy_http_version 1.1;
        proxy_set_header Host notification-service.finflow.svc.cluster.local;
        proxy_set_header Connection "";
    }

    location /health {
        proxy_pass http://transaction-api.finflow.svc.cluster.local;
        proxy_http_version 1.1;
        proxy_set_header Host transaction-api.finflow.svc.cluster.local;
        proxy_set_header Connection "";
    }
}
