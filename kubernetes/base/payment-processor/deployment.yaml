apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processor
  namespace: finflow
  labels:
    app: payment-processor
    version: v1
    app.kubernetes.io/name: payment-processor
    app.kubernetes.io/part-of: finflow
    app.kubernetes.io/component: processor
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-processor
      version: v1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: payment-processor
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: payment-processor
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: payment-processor
          image: gcr.io/finflow/payment-processor:latest
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: PORT
              value: "8081"
            - name: SERVICE_NAME
              value: "payment-processor"
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: kafka-bootstrap-servers
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: payment-processor
