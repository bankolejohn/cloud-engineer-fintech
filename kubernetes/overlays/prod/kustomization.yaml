apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: finflow

resources:
  - ../../base

patches:
  # Production replicas
  - target:
      kind: Deployment
      name: transaction-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: payment-processor
    patch: |
      - op: replace
        path: /spec/replicas
        value: 5
  - target:
      kind: Deployment
      name: fraud-detection
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: account-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: notification-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  # Production resource requests
  - target:
      kind: Deployment
      name: payment-processor
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi

images:
  - name: gcr.io/finflow/transaction-api
    newTag: v1.0.0
  - name: gcr.io/finflow/payment-processor
    newTag: v1.0.0
  - name: gcr.io/finflow/fraud-detection
    newTag: v1.0.0
  - name: gcr.io/finflow/account-service
    newTag: v1.0.0
  - name: gcr.io/finflow/notification-service
    newTag: v1.0.0

commonLabels:
  environment: production

commonAnnotations:
  finflow.io/environment: "production"
  finflow.io/sla: "99.99"
