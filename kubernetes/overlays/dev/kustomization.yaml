apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: finflow

resources:
  - ../../base

patches:
  # Scale down replicas for dev
  - target:
      kind: Deployment
      name: transaction-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: payment-processor
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: fraud-detection
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: account-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: notification-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  # Reduce resource limits for dev
  - target:
      kind: ResourceQuota
      name: finflow-quota
    patch: |
      - op: replace
        path: /spec/hard/requests.cpu
        value: "4"
      - op: replace
        path: /spec/hard/requests.memory
        value: 8Gi
      - op: replace
        path: /spec/hard/pods
        value: "20"

images:
  - name: gcr.io/finflow/transaction-api
    newTag: dev-latest
  - name: gcr.io/finflow/payment-processor
    newTag: dev-latest
  - name: gcr.io/finflow/fraud-detection
    newTag: dev-latest
  - name: gcr.io/finflow/account-service
    newTag: dev-latest
  - name: gcr.io/finflow/notification-service
    newTag: dev-latest

commonLabels:
  environment: dev

commonAnnotations:
  finflow.io/environment: "development"
