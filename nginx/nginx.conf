# ==============================================================================
# Nginx Configuration - FinFlow API Gateway & Reverse Proxy
# Rate limiting, request filtering, upstream health monitoring
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # =========================================================================
    # Logging
    # =========================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time '
                    'rid=$request_id';

    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"request_id":"$request_id",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json;

    # =========================================================================
    # Performance
    # =========================================================================
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 100;
    reset_timedout_connection on;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Buffer sizes
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    client_max_body_size 10m;
    large_client_header_buffers 4 8k;

    # =========================================================================
    # Rate Limiting Zones
    # =========================================================================
    
    # Global rate limit: 100 requests/second per IP
    limit_req_zone $binary_remote_addr zone=global:10m rate=100r/s;
    
    # API rate limit: 50 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    
    # Transaction creation: 10 requests/second per IP (stricter)
    limit_req_zone $binary_remote_addr zone=transactions:10m rate=10r/s;
    
    # Auth endpoints: 5 requests/second (prevent brute force)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # Rate limit response
    limit_req_status 429;
    limit_conn_status 429;

    # =========================================================================
    # Upstream Definitions (with health monitoring)
    # =========================================================================
    
    upstream transaction_api {
        zone transaction_api_zone 64k;
        
        # Load balancing: least connections
        least_conn;
        
        server 10.0.1.10:8080 max_fails=3 fail_timeout=30s weight=5;
        server 10.0.1.11:8080 max_fails=3 fail_timeout=30s weight=5;
        server 10.0.1.12:8080 max_fails=3 fail_timeout=30s weight=5;
        
        # Backup server (AWS)
        server 10.10.1.10:8080 backup;
        
        # Keep alive connections to upstream
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    upstream payment_processor {
        zone payment_processor_zone 64k;
        
        # Round robin for payment processing
        server 10.0.1.20:8081 max_fails=2 fail_timeout=60s;
        server 10.0.1.21:8081 max_fails=2 fail_timeout=60s;
        server 10.0.1.22:8081 max_fails=2 fail_timeout=60s;
        
        keepalive 16;
    }

    upstream fraud_detection {
        zone fraud_detection_zone 64k;
        
        least_conn;
        
        server 10.0.1.30:8083 max_fails=5 fail_timeout=30s;
        server 10.0.1.31:8083 max_fails=5 fail_timeout=30s;
        
        keepalive 16;
    }

    upstream account_service {
        zone account_service_zone 64k;
        
        least_conn;
        
        server 10.0.1.40:8082 max_fails=3 fail_timeout=30s;
        server 10.0.1.41:8082 max_fails=3 fail_timeout=30s;
        
        keepalive 16;
    }

    upstream notification_service {
        zone notification_service_zone 64k;
        
        server 10.0.1.50:8084 max_fails=5 fail_timeout=30s;
        server 10.0.1.51:8084 max_fails=5 fail_timeout=30s;
        
        keepalive 8;
    }

    # =========================================================================
    # Security: Block bad actors
    # =========================================================================
    
    # Block known bad IPs (populated by fail2ban or threat intelligence)
    # geo $blocked_ip {
    #     default 0;
    #     include /etc/nginx/blocked_ips.conf;
    # }

    # Map for request filtering
    map $http_user_agent $bad_bot {
        default 0;
        ~*sqlmap 1;
        ~*nikto 1;
        ~*scanner 1;
        ~*exploit 1;
    }

    # =========================================================================
    # HTTPS Server - API Gateway
    # =========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.finflow.io;

        # SSL configuration
        ssl_certificate     /etc/nginx/ssl/finflow.crt;
        ssl_certificate_key /etc/nginx/ssl/finflow.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Request ID for distributed tracing
        proxy_set_header X-Request-ID $request_id;

        # Connection limiting
        limit_conn conn_per_ip 50;

        # Block bad bots
        if ($bad_bot) {
            return 403;
        }

        # Health check endpoint (no rate limiting)
        location /health {
            proxy_pass http://transaction_api;
            proxy_set_header Host $host;
            access_log off;
        }

        # Metrics endpoint (internal only)
        location /metrics {
            allow 10.0.0.0/8;
            deny all;
            proxy_pass http://transaction_api;
        }

        # =====================================================================
        # Transaction API routes
        # =====================================================================
        location /api/v1/transactions {
            limit_req zone=transactions burst=20 nodelay;
            
            proxy_pass http://transaction_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
            
            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # =====================================================================
        # Account Service routes
        # =====================================================================
        location /api/v1/accounts {
            limit_req zone=api burst=30 nodelay;
            
            proxy_pass http://account_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        # =====================================================================
        # Fraud Detection routes (internal, but exposed for testing)
        # =====================================================================
        location /api/v1/score {
            limit_req zone=api burst=50 nodelay;
            
            proxy_pass http://fraud_detection;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        # =====================================================================
        # Notification routes
        # =====================================================================
        location /api/v1/notify {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://notification_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            
            proxy_read_timeout 15s;
        }

        # =====================================================================
        # Default: 404 for unmatched routes
        # =====================================================================
        location / {
            return 404 '{"error": "Not Found", "message": "The requested endpoint does not exist"}';
            add_header Content-Type application/json;
        }
    }

    # =========================================================================
    # HTTP Server - Redirect to HTTPS
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name api.finflow.io;

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # Nginx Status (for monitoring)
    # =========================================================================
    server {
        listen 8080;
        server_name localhost;

        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            deny all;
        }

        location /health {
            return 200 '{"status": "healthy"}';
            add_header Content-Type application/json;
            access_log off;
        }
    }
}

# =========================================================================
# Stream (TCP/UDP) - For non-HTTP protocols
# =========================================================================
stream {
    # Log format for TCP connections
    log_format tcp_log '$remote_addr [$time_local] '
                       '$protocol $status $bytes_sent $bytes_received '
                       '$session_time "$upstream_addr"';

    # TCP load balancing for Kafka
    upstream kafka_brokers {
        zone kafka_zone 64k;
        server 10.0.3.10:9092;
        server 10.0.3.11:9092;
        server 10.0.3.12:9092;
    }

    server {
        listen 9092;
        proxy_pass kafka_brokers;
        proxy_timeout 300s;
        proxy_connect_timeout 5s;
        access_log /var/log/nginx/kafka_access.log tcp_log;
    }
}
