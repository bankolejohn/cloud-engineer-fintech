# ==============================================================================
# FinFlow Dashboard — Web UI for the platform
#
# WHAT: A simple Nginx-based dashboard that proxies API calls to backend services
# WHY:  Visual interface for testing, demos, and load generation
#       Instead of curl, you click buttons and see results in real-time
#
# NOTE: This is a PLATFORM TOOL, not the real Moniepoint app.
#       The real mobile/web app would be built by frontend engineers.
#       This helps platform engineers demo and test infrastructure.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: finflow
  labels:
    app: dashboard
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
        version: v1
    spec:
      containers:
        - name: dashboard
          image: finflow/dashboard:v1.0.1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8090
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: finflow
  labels:
    app: dashboard
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081
  selector:
    app: dashboard
