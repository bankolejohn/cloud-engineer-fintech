# ==============================================================================
# All FinFlow Services — Local Development Manifests
#
# Differences from production (kubernetes/base/):
# - imagePullPolicy: Never (images loaded into kind directly)
# - Local image names (finflow/ instead of gcr.io/finflow/)
# - 1 replica each (resource constrained)
# - No Vault annotations (no Vault in local)
# - No topology spread (only 2 nodes)
# - Relaxed security context for local testing
#
# Production configs remain untouched on main branch.
# ==============================================================================

# ─── Transaction API ─────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: transaction-api
  namespace: finflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-api
  namespace: finflow
  labels:
    app: transaction-api
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-api
  template:
    metadata:
      labels:
        app: transaction-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: transaction-api
      containers:
        - name: transaction-api
          image: finflow/transaction-api:v1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SERVICE_NAME
              value: "transaction-api"
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: kafka-bootstrap-servers
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-api
  namespace: finflow
  labels:
    app: transaction-api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app: transaction-api

