# ==============================================================================
# Kafka Cluster — Local Development (Strimzi v1 / KRaft mode)
#
# WHAT: A single-broker Kafka cluster for local event streaming
#
# WHY:  In production we have 3 brokers with replication for fault tolerance.
#       Locally, 1 broker is enough to learn the concepts:
#       - Topics, partitions, producers, consumers
#       - Consumer groups and rebalancing
#       - Event-driven service communication
#
# PRODUCTION DIFFERENCES:
#       Production (kafka/cluster.yaml):         Local:
#       - 3 brokers across 3 zones              - 1 broker (resource constrained)
#       - Persistent storage (100Gi SSD)        - Ephemeral (data lost on restart)
#       - TLS + SASL authentication             - Plain (no auth for simplicity)
#       - ZooKeeper or KRaft HA                 - KRaft single node
#
# HOW:  kubectl apply -f local-dev/k8s/04-kafka.yaml
# ==============================================================================

# KafkaNodePool: Defines the broker pool (replaces the old spec.kafka.replicas/storage)
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  namespace: finflow-kafka
  labels:
    strimzi.io/cluster: finflow-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: ephemeral
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
---
# Kafka cluster (KRaft mode — no ZooKeeper)
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: finflow-kafka
  namespace: finflow-kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
  labels:
    app.kubernetes.io/part-of: finflow
spec:
  kafka:
    version: 4.2.0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: false
      log.retention.hours: 1
      log.retention.bytes: 536870912

  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    userOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

---
# ==============================================================================
# Kafka Topics for FinFlow
#
# WHY each topic exists:
# - transactions.created:      Transaction API publishes when user initiates payment
# - transactions.processed:    Payment Processor publishes when payment completes/fails
# - transactions.fraud-scored: Fraud Detection publishes risk scores
# - notifications.outbound:    Triggers notification delivery to users
# - finflow.dlq:              Dead letter queue for failed message processing
# ==============================================================================
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: transactions.created
  namespace: finflow-kafka
  labels:
    strimzi.io/cluster: finflow-kafka
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: "3600000"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: transactions.processed
  namespace: finflow-kafka
  labels:
    strimzi.io/cluster: finflow-kafka
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: "3600000"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: transactions.fraud-scored
  namespace: finflow-kafka
  labels:
    strimzi.io/cluster: finflow-kafka
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: "3600000"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: notifications.outbound
  namespace: finflow-kafka
  labels:
    strimzi.io/cluster: finflow-kafka
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: "3600000"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: finflow.dlq
  namespace: finflow-kafka
  labels:
    strimzi.io/cluster: finflow-kafka
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: "86400000"
