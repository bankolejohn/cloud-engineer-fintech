# ==============================================================================
# ArgoCD App of Apps Pattern
# Root application that manages all FinFlow service applications
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finflow-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: finflow
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: finflow
  source:
    repoURL: https://github.com/finflow/finflow-platform.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
