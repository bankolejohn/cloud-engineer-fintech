# ==============================================================================
# HashiCorp Vault - Helm Values for HA Deployment
# Install: helm install vault hashicorp/vault -f helm-values.yaml -n vault
# ==============================================================================

global:
  enabled: true
  tlsDisable: false

server:
  image:
    repository: hashicorp/vault
    tag: "1.15.4"

  # HA mode with Raft integrated storage
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 0
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file = "/vault/userconfig/vault-tls/tls.crt"
          tls_key_file = "/vault/userconfig/vault-tls/tls.key"
          tls_client_ca_file = "/vault/userconfig/vault-tls/ca.crt"
        }

        storage "raft" {
          path = "/vault/data"
          retry_join {
            leader_api_addr = "https://vault-0.vault-internal:8200"
            leader_ca_cert_file = "/vault/userconfig/vault-tls/ca.crt"
          }
          retry_join {
            leader_api_addr = "https://vault-1.vault-internal:8200"
            leader_ca_cert_file = "/vault/userconfig/vault-tls/ca.crt"
          }
          retry_join {
            leader_api_addr = "https://vault-2.vault-internal:8200"
            leader_ca_cert_file = "/vault/userconfig/vault-tls/ca.crt"
          }
        }

        # Auto-unseal using GCP Cloud KMS
        seal "gcpckms" {
          project     = "finflow-prod"
          region      = "us-central1"
          key_ring    = "vault-keyring"
          crypto_key  = "vault-unseal-key"
        }

        # Telemetry for Prometheus
        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }

        service_registration "kubernetes" {}

  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

  # Extra volumes for TLS certificates
  extraVolumes:
    - type: secret
      name: vault-tls
      path: /vault/userconfig

  # Affinity for HA
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: vault
          topologyKey: topology.kubernetes.io/zone

  # Audit logging
  auditStorage:
    enabled: true
    size: 10Gi

  dataStorage:
    enabled: true
    size: 20Gi
    storageClass: ssd

# Vault Agent Injector (sidecar for K8s pods)
injector:
  enabled: true
  replicas: 2
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 250m

# UI
ui:
  enabled: true
  serviceType: ClusterIP
