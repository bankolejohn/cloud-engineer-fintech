# ==============================================================================
# Vault Agent Injector Annotations Reference
# Applied to pod deployments for automatic secret injection
# ==============================================================================

# Example: Transaction API pod with Vault Agent sidecar
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-api-vault-example
  namespace: finflow
spec:
  template:
    metadata:
      annotations:
        # Enable Vault Agent injection
        vault.hashicorp.com/agent-inject: "true"
        
        # Vault role (matches K8s service account)
        vault.hashicorp.com/role: "transaction-api"
        
        # Inject database credentials
        vault.hashicorp.com/agent-inject-secret-db-creds: "database/creds/transaction-api"
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "database/creds/transaction-api" -}}
          export DB_USERNAME="{{ .Data.username }}"
          export DB_PASSWORD="{{ .Data.password }}"
          export DB_HOST="finflow-mysql.internal"
          export DB_PORT="3306"
          export DB_NAME="finflow"
          export DATABASE_URL="mysql://{{ .Data.username }}:{{ .Data.password }}@finflow-mysql.internal:3306/finflow"
          {{- end }}
        
        # Inject API keys from KV store
        vault.hashicorp.com/agent-inject-secret-api-keys: "secret/data/finflow/transaction-api"
        vault.hashicorp.com/agent-inject-template-api-keys: |
          {{- with secret "secret/data/finflow/transaction-api" -}}
          export API_KEY="{{ .Data.data.api_key }}"
          {{- end }}
        
        # Inject TLS certificate from PKI
        vault.hashicorp.com/agent-inject-secret-tls-cert: "pki/issue/finflow-services"
        vault.hashicorp.com/agent-inject-template-tls-cert: |
          {{- with secret "pki/issue/finflow-services" "common_name=transaction-api.finflow.svc.cluster.local" -}}
          {{ .Data.certificate }}
          {{- end }}
        
        vault.hashicorp.com/agent-inject-secret-tls-key: "pki/issue/finflow-services"
        vault.hashicorp.com/agent-inject-template-tls-key: |
          {{- with secret "pki/issue/finflow-services" "common_name=transaction-api.finflow.svc.cluster.local" -}}
          {{ .Data.private_key }}
          {{- end }}
        
        # Pre-populate secrets before app starts
        vault.hashicorp.com/agent-pre-populate-only: "false"
        
        # Auto-renew secrets (dynamic DB creds rotate automatically)
        vault.hashicorp.com/agent-cache-enable: "true"
        vault.hashicorp.com/agent-run-as-user: "65534"
---
# Vault CSI Provider (alternative to sidecar injection)
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: vault-finflow-db
  namespace: finflow
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.vault.svc.cluster.local:8200"
    roleName: "transaction-api"
    objects: |
      - objectName: "db-username"
        secretPath: "database/creds/transaction-api"
        secretKey: "username"
      - objectName: "db-password"
        secretPath: "database/creds/transaction-api"
        secretKey: "password"
  secretObjects:
    - data:
        - key: username
          objectName: db-username
        - key: password
          objectName: db-password
      secretName: finflow-db-credentials
      type: Opaque
