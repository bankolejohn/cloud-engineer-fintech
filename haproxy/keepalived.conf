# ==============================================================================
# Keepalived Configuration - HAProxy High Availability
# VRRP failover between primary and backup HAProxy instances
# ==============================================================================

global_defs {
    router_id FINFLOW_LB
    script_user haproxy
    enable_script_security
}

# Health check script for HAProxy
vrrp_script check_haproxy {
    script "/usr/bin/killall -0 haproxy"
    interval 2
    weight -2
    fall 3
    rise 2
}

# VRRP Instance for primary VIP
vrrp_instance FINFLOW_VIP {
    state MASTER           # BACKUP on secondary node
    interface eth0
    virtual_router_id 51
    priority 101           # 100 on secondary node
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass finflow_ha_secret
    }

    # Virtual IP address (floating IP)
    virtual_ipaddress {
        10.0.0.100/24 dev eth0
    }

    track_script {
        check_haproxy
    }

    # Notify scripts for failover actions
    notify_master "/etc/keepalived/notify.sh MASTER"
    notify_backup "/etc/keepalived/notify.sh BACKUP"
    notify_fault  "/etc/keepalived/notify.sh FAULT"
}

# Secondary VRRP for internal traffic
vrrp_instance FINFLOW_VIP_INTERNAL {
    state MASTER
    interface eth1
    virtual_router_id 52
    priority 101

    authentication {
        auth_type PASS
        auth_pass finflow_ha_internal
    }

    virtual_ipaddress {
        10.0.10.100/24 dev eth1
    }

    track_script {
        check_haproxy
    }
}
