# ==============================================================================
# HAProxy Configuration - FinFlow Platform
# High-performance load balancing with ACLs, health checks, and session persistence
# ==============================================================================

global
    log         /dev/log local0
    log         /dev/log local1 notice
    chroot      /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user        haproxy
    group       haproxy
    daemon

    # SSL/TLS settings
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

    # Performance tuning
    maxconn     50000
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  forwardfor except 127.0.0.0/8
    option  redispatch
    retries 3
    timeout http-request    10s
    timeout queue           1m
    timeout connect         5s
    timeout client          30s
    timeout server          30s
    timeout http-keep-alive 10s
    timeout check           5s
    maxconn 10000

    # Custom error pages
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# ==============================================================================
# Stats Dashboard
# ==============================================================================
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST
    stats auth admin:finflow-stats-secret

# ==============================================================================
# Frontend: HTTPS (port 443)
# ==============================================================================
frontend https_front
    bind *:443 ssl crt /etc/haproxy/certs/finflow.pem alpn h2,http/1.1
    bind *:80

    # Redirect HTTP to HTTPS
    http-request redirect scheme https unless { ssl_fc }

    # Security headers
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    http-response set-header X-Frame-Options "DENY"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-XSS-Protection "1; mode=block"

    # Request ID for tracing
    http-request set-header X-Request-ID %[uuid()] unless { hdr(X-Request-ID) -m found }

    # Rate limiting (stick table)
    stick-table type ip size 100k expire 30s store http_req_rate(10s),conn_cur
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }

    # ACL definitions
    acl is_api path_beg /api/
    acl is_health path /health /ready
    acl is_metrics path /metrics
    acl is_payment path_beg /api/v1/transactions
    acl is_account path_beg /api/v1/accounts
    acl is_fraud path_beg /api/v1/score
    acl is_websocket hdr(Upgrade) -i WebSocket

    # Block suspicious requests
    acl is_blocked_ua hdr_sub(User-Agent) -i scanner exploit sqlmap
    http-request deny if is_blocked_ua

    # Allow health checks without rate limiting
    http-request allow if is_health

    # Route to backends based on ACLs
    use_backend transaction_api if is_payment
    use_backend account_service if is_account
    use_backend fraud_detection if is_fraud
    use_backend health_backend if is_health

    # Default backend
    default_backend transaction_api

# ==============================================================================
# Backend: Transaction API
# ==============================================================================
backend transaction_api
    balance leastconn
    option httpchk GET /health
    http-check expect status 200

    # Session persistence (sticky sessions via cookie)
    cookie SERVERID insert indirect nocache

    # Slow start (ramp up traffic to new servers)
    default-server inter 3s fall 3 rise 2 slowstart 60s

    # Connection limits per server
    default-server maxconn 200

    # Servers (dynamically populated in production via service discovery)
    server txn-api-1 10.0.1.10:8080 check cookie s1 weight 100
    server txn-api-2 10.0.1.11:8080 check cookie s2 weight 100
    server txn-api-3 10.0.1.12:8080 check cookie s3 weight 100
    # Backup server (only receives traffic if all primary servers are down)
    server txn-api-backup 10.10.1.10:8080 check cookie s4 backup

# ==============================================================================
# Backend: Account Service
# ==============================================================================
backend account_service
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200

    default-server inter 5s fall 3 rise 2

    server acct-1 10.0.1.20:8082 check weight 100
    server acct-2 10.0.1.21:8082 check weight 100

# ==============================================================================
# Backend: Fraud Detection
# ==============================================================================
backend fraud_detection
    balance leastconn
    option httpchk GET /health
    http-check expect status 200

    # Higher timeout for ML model inference
    timeout server 10s

    default-server inter 5s fall 5 rise 2

    server fraud-1 10.0.1.30:8083 check weight 100
    server fraud-2 10.0.1.31:8083 check weight 100

# ==============================================================================
# Backend: Health checks (all services)
# ==============================================================================
backend health_backend
    balance roundrobin
    option httpchk GET /health
    server txn-api-1 10.0.1.10:8080 check

# ==============================================================================
# Frontend: TCP mode for MySQL (ProxySQL sits behind this)
# ==============================================================================
frontend mysql_front
    bind *:3306
    mode tcp
    option tcplog
    timeout client 1h

    # ACL: Only allow from known application subnets
    acl is_app_subnet src 10.0.0.0/16 10.10.0.0/16

    tcp-request connection reject unless is_app_subnet

    default_backend proxysql_backend

backend proxysql_backend
    mode tcp
    balance roundrobin
    option tcp-check
    timeout server 1h

    server proxysql-1 10.0.2.10:6033 check inter 5s fall 3 rise 2
    server proxysql-2 10.0.2.11:6033 check inter 5s fall 3 rise 2 backup
