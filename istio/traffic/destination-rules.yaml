# ==============================================================================
# Istio DestinationRules - Traffic policies, load balancing, circuit breaking
# ==============================================================================

# Transaction API
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: transaction-api
  namespace: finflow
spec:
  host: transaction-api
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 5s
      http:
        h2UpgradePolicy: DEFAULT
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
        maxRequestsPerConnection: 10
        maxRetries: 3
    loadBalancer:
      simple: LEAST_REQUEST
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
---
# Payment Processor - Stricter circuit breaking for payment critical path
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: payment-processor
  namespace: finflow
spec:
  host: payment-processor
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 50
        connectTimeout: 3s
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 500
        maxRequestsPerConnection: 5
        maxRetries: 2
    loadBalancer:
      simple: ROUND_ROBIN
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 5s
      baseEjectionTime: 60s
      maxEjectionPercent: 30
      minHealthPercent: 70
  subsets:
    - name: v1
      labels:
        version: v1
      trafficPolicy:
        connectionPool:
          http:
            http2MaxRequests: 500
---
