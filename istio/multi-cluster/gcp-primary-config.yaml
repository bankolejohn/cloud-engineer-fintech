# ==============================================================================
# Istio Multi-Cluster Configuration - GCP Primary Cluster
# Enables cross-cluster service discovery and traffic routing
# ==============================================================================

# Remote secret for AWS cluster (allows GCP to discover AWS services)
# Generated with: istioctl create-remote-secret --name=aws-secondary
# Applied to this (GCP) cluster to enable cross-cluster connectivity

---
# Multi-cluster Gateway for cross-cluster traffic
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: cross-cluster-gateway
  namespace: istio-system
spec:
  selector:
    istio: eastwestgateway
  servers:
    - port:
        number: 15443
        name: tls
        protocol: TLS
      tls:
        mode: AUTO_PASSTHROUGH
      hosts:
        - "*.local"
---
# East-West Gateway deployment for multi-cluster
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: eastwest-gateway
  namespace: istio-system
spec:
  profile: empty
  components:
    ingressGateways:
      - name: istio-eastwestgateway
        label:
          istio: eastwestgateway
          app: istio-eastwestgateway
          topology.istio.io/network: gcp-network
        enabled: true
        k8s:
          env:
            - name: ISTIO_META_REQUESTED_NETWORK_VIEW
              value: gcp-network
          service:
            ports:
              - name: status-port
                port: 15021
                targetPort: 15021
              - name: tls
                port: 15443
                targetPort: 15443
              - name: tls-istiod
                port: 15012
                targetPort: 15012
              - name: tls-webhook
                port: 15017
                targetPort: 15017
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
  values:
    global:
      meshID: finflow-mesh
      multiCluster:
        clusterName: gcp-primary
      network: gcp-network
