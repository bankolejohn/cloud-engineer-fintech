# ==============================================================================
# Istio RequestAuthentication - JWT validation for external requests
# ==============================================================================

# Validate JWT tokens on the transaction-api (external-facing)
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: transaction-api-jwt
  namespace: finflow
spec:
  selector:
    matchLabels:
      app: transaction-api
  jwtRules:
    - issuer: "https://auth.finflow.io"
      jwksUri: "https://auth.finflow.io/.well-known/jwks.json"
      audiences:
        - "finflow-api"
      forwardOriginalToken: true
      outputPayloadToHeader: "x-jwt-payload"
---
# Require valid JWT for external requests (not internal mesh traffic)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: require-jwt-for-external
  namespace: finflow
spec:
  selector:
    matchLabels:
      app: transaction-api
  action: ALLOW
  rules:
    # Allow requests with valid JWT from external
    - from:
        - source:
            requestPrincipals: ["https://auth.finflow.io/*"]
      to:
        - operation:
            paths: ["/api/v1/*"]
    # Allow internal mesh traffic (service-to-service)
    - from:
        - source:
            namespaces: ["finflow"]
    # Always allow health checks
    - to:
        - operation:
            paths: ["/health", "/ready", "/metrics"]
