# ==============================================================================
# Istio Retry and Timeout Policies
# Define retry behavior and timeouts for each service interaction
# ==============================================================================

# Transaction API -> Payment Processor (critical path, conservative retries)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: payment-processor-retry-policy
  namespace: finflow
spec:
  hosts:
    - payment-processor
  http:
    - route:
        - destination:
            host: payment-processor
            subset: v1
      timeout: 30s
      retries:
        attempts: 2
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
        # Don't retry on 4xx - those are client errors
        # Only retry on infrastructure failures
---
# Transaction API -> Fraud Detection (can retry more aggressively)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: fraud-detection-retry-policy
  namespace: finflow
spec:
  hosts:
    - fraud-detection
  http:
    - route:
        - destination:
            host: fraud-detection
            subset: v1
      timeout: 5s  # Fraud scoring should be fast
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream,unavailable,resource-exhausted
---
# Transaction API -> Account Service
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: account-service-retry-policy
  namespace: finflow
spec:
  hosts:
    - account-service
  http:
    - route:
        - destination:
            host: account-service
            subset: v1
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 3s
        retryOn: gateway-error,connect-failure,refused-stream,unavailable
---
# Payment Processor -> Notification Service (fire-and-forget, lenient)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: notification-service-retry-policy
  namespace: finflow
spec:
  hosts:
    - notification-service
  http:
    - route:
        - destination:
            host: notification-service
            subset: v1
      timeout: 15s
      retries:
        attempts: 5  # More retries ok for non-critical notifications
        perTryTimeout: 5s
        retryOn: gateway-error,connect-failure,refused-stream,unavailable,cancelled
