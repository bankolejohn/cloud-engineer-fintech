# ==============================================================================
# Istio Fault Injection - Chaos engineering for resilience testing
# Apply these in staging/dev to test circuit breakers and retries
# ==============================================================================

# Inject delays into payment-processor (simulate slow payment gateway)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: payment-processor-fault-test
  namespace: finflow
spec:
  hosts:
    - payment-processor
  http:
    - fault:
        delay:
          percentage:
            value: 10.0  # 10% of requests get delayed
          fixedDelay: 5s
        abort:
          percentage:
            value: 5.0   # 5% of requests get HTTP 503
          httpStatus: 503
      route:
        - destination:
            host: payment-processor
            subset: v1
---
# Inject failures into fraud-detection (simulate model timeout)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: fraud-detection-fault-test
  namespace: finflow
spec:
  hosts:
    - fraud-detection
  http:
    - fault:
        delay:
          percentage:
            value: 20.0  # 20% delayed (ML models can be slow)
          fixedDelay: 3s
        abort:
          percentage:
            value: 10.0  # 10% fail
          httpStatus: 500
      route:
        - destination:
            host: fraud-detection
            subset: v1
---
# Inject failures into account-service (simulate DB connection issues)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: account-service-fault-test
  namespace: finflow
spec:
  hosts:
    - account-service
  http:
    - fault:
        delay:
          percentage:
            value: 5.0
          fixedDelay: 2s
        abort:
          percentage:
            value: 3.0
          httpStatus: 503
      route:
        - destination:
            host: account-service
            subset: v1
