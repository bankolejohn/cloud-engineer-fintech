# ==============================================================================
# Apache Kafka Cluster (Strimzi Operator)
# Production-grade multi-broker cluster with replication and monitoring
# ==============================================================================
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: finflow-kafka
  namespace: finflow-kafka
  labels:
    app.kubernetes.io/part-of: finflow
spec:
  kafka:
    version: 3.6.1
    replicas: 3
    
    listeners:
      # Internal listener (within K8s cluster)
      - name: plain
        port: 9092
        type: internal
        tls: false
      # TLS listener (for cross-cluster communication)
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
      # External listener (for development/testing)
      - name: external
        port: 9094
        type: loadbalancer
        tls: true
        authentication:
          type: tls

    config:
      # Replication
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      
      # Performance tuning
      num.partitions: 12
      num.network.threads: 8
      num.io.threads: 16
      socket.send.buffer.bytes: 102400
      socket.receive.buffer.bytes: 102400
      socket.request.max.bytes: 104857600
      
      # Log retention
      log.retention.hours: 168  # 7 days
      log.retention.bytes: 107374182400  # 100GB per partition
      log.segment.bytes: 1073741824  # 1GB segments
      log.cleanup.policy: "delete,compact"
      
      # Consumer settings
      group.max.session.timeout.ms: 300000
      
      # Inter-broker protocol
      inter.broker.protocol.version: "3.6"
      
      # Auto topic creation disabled (topics managed via GitOps)
      auto.create.topics.enable: false

    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 100Gi
          class: ssd
          deleteClaim: false

    resources:
      requests:
        memory: 2Gi
        cpu: "1"
      limits:
        memory: 4Gi
        cpu: "2"

    jvmOptions:
      -Xms: 1536m
      -Xmx: 1536m

    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics-config
          key: kafka-metrics-config.yml

    rack:
      topologyKey: topology.kubernetes.io/zone

    template:
      pod:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: strimzi.io/name
                      operator: In
                      values:
                        - finflow-kafka-kafka
                topologyKey: topology.kubernetes.io/zone

  # ZooKeeper configuration
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 20Gi
      class: ssd
      deleteClaim: false
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 500m
    jvmOptions:
      -Xms: 384m
      -Xmx: 384m
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics-config
          key: zookeeper-metrics-config.yml

  # Entity Operator (manages topics and users)
  entityOperator:
    topicOperator:
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
    userOperator:
      resources:
        requests:
          memory: 256Mi
          cpu: 100m

  # Cruise Control for cluster balancing
  cruiseControl:
    resources:
      requests:
        memory: 512Mi
        cpu: 200m
      limits:
        memory: 1Gi
        cpu: 500m
