# ==============================================================================
# Kafka Topics - FinFlow Event Streaming
# Designed for high-throughput transaction processing
# ==============================================================================

# Transaction events - Main event stream
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: transactions.created
  namespace: finflow-kafka
  labels:
    strimzi.io/cluster: finflow-kafka
    domain: transactions
spec:
  partitions: 12       # High partition count for parallelism
  replicas: 3          # Full replication across all brokers
  config:
    retention.ms: 604800000      # 7 days
    retention.bytes: 10737418240 # 10GB
    cleanup.policy: delete
    min.insync.replicas: 2
    segment.bytes: 536870912     # 512MB segments
    max.message.bytes: 1048576   # 1MB max message
---
# Transaction processing results
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: transactions.processed
  namespace: finflow-kafka
  labels:
    strimzi.io/cluster: finflow-kafka
    domain: transactions
spec:
  partitions: 12
  replicas: 3
  config:
    retention.ms: 604800000
    cleanup.policy: delete
    min.insync.replicas: 2
---
# Transaction status changes (compacted - latest status per transaction)
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: transactions.status
  namespace: finflow-kafka
  labels:
    strimzi.io/cluster: finflow-kafka
    domain: transactions
spec:
  partitions: 12
  replicas: 3
  config:
    retention.ms: -1              # Keep forever (compacted)
    cleanup.policy: compact
    min.cleanable.dirty.ratio: 0.5
    delete.retention.ms: 86400000 # Tombstones kept 24h
    min.insync.replicas: 2
---
# Fraud detection scores
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: transactions.fraud-scored
  namespace: finflow-kafka
  labels:
    strimzi.io/cluster: finflow-kafka
    domain: fraud
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 2592000000  # 30 days (for audit)
    cleanup.policy: delete
    min.insync.replicas: 2
---
# Notifications to send
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: notifications.outbound
  namespace: finflow-kafka
  labels:
    strimzi.io/cluster: finflow-kafka
    domain: notifications
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 259200000  # 3 days
    cleanup.policy: delete
    min.insync.replicas: 2
---
# Notification delivery status
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: notifications.delivery-status
  namespace: finflow-kafka
  labels:
    strimzi.io/cluster: finflow-kafka
    domain: notifications
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
# Account events (balance changes, account creation)
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: accounts.events
  namespace: finflow-kafka
  labels:
    strimzi.io/cluster: finflow-kafka
    domain: accounts
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 2592000000  # 30 days
    cleanup.policy: delete
    min.insync.replicas: 2
---
# Dead Letter Queue - Failed messages for investigation
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: finflow.dlq
  namespace: finflow-kafka
  labels:
    strimzi.io/cluster: finflow-kafka
    domain: infrastructure
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000  # 30 days
    cleanup.policy: delete
---
# CDC events from MySQL (Debezium)
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: cdc.finflow.transactions
  namespace: finflow-kafka
  labels:
    strimzi.io/cluster: finflow-kafka
    domain: cdc
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 604800000
    cleanup.policy: delete
    min.insync.replicas: 2
